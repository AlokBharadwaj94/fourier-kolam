  <text x="186" y="422" font-size="13.5" font-weight="600" fill="#16161a">One gate, two pulli</text>
  <text x="186" y="443" font-size="12" fill="#55555f">Opening a gate raises the level of both dots it joins, and every gate links a dark</text>
